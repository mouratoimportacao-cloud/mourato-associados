version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - aws secretsmanager get-secret-value --secret-id "mourato-associados/env" --region sa-east-1 --query SecretString --output text | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'{k}={v}') for k,v in d.items()]" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
